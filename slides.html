<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slaydlar (Reveal.js) — Kompyuterli Ko'rish (KOK1506)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.css" id="reveal-theme">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-primary);
      color: var(--text-primary);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .slides-topbar {
      height: 58px;
      flex-shrink: 0;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      gap: 0.75rem;
      z-index: 100;
    }

    .slides-topbar .brand-mini {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--text-primary);
      text-decoration: none;
      white-space: nowrap;
    }

    .slides-topbar .brand-mini span.icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: #06101e;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 0.85rem;
    }

    .slides-controls {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    .topic-select {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.36rem 0.6rem;
      font-size: 0.82rem;
      max-width: 290px;
    }

    .deck-stage {
      flex: 1;
      min-height: 0;
      position: relative;
      width: 100%;
    }

    .reveal {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top right, rgba(6, 182, 212, 0.11), transparent 55%),
                  var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
    }

    .reveal .slides section {
      text-align: left;
      padding: 1.5rem 2.2rem;
      box-sizing: border-box;
      overflow-y: auto;
      max-height: 100%;
    }

    .reveal h1, .reveal h2, .reveal h3 {
      text-transform: none;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      font-family: var(--font-sans);
    }

    .reveal h2 {
      font-size: 1.55em;
      color: var(--accent);
      margin-bottom: 0.55em;
    }

    .reveal h3 {
      font-size: 1.12em;
      color: var(--text-secondary);
    }

    .reveal ul {
      display: block;
      margin: 0.45em 0 0.7em 1.2em;
      font-size: 0.86em;
      line-height: 1.5;
    }

    .reveal li {
      margin-bottom: 0.38em;
    }

    .slide-pill {
      display: inline-block;
      font-size: 0.46em;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--border-accent);
      padding: 0.28em 0.75em;
      border-radius: 999px;
      margin-bottom: 0.65em;
    }

    .slide-pill.bonus {
      background: rgba(168, 85, 247, 0.16);
      color: #c084fc;
      border-color: rgba(168, 85, 247, 0.4);
    }

    .slide-lead {
      font-size: 0.82em;
      color: var(--text-secondary);
      line-height: 1.5;
      max-width: 90%;
    }

    .slide-formula-card {
      background: var(--bg-code);
      color: #a5f3fc;
      border: 1px solid var(--border-accent);
      border-radius: 12px;
      padding: 0.65em 1em;
      margin: 0.55em 0;
      font-size: 0.86em;
      text-align: center;
      overflow-x: auto;
    }

    .slide-discuss-card {
      background: rgba(6, 182, 212, 0.1);
      border-left: 4px solid var(--accent);
      border-radius: 0 12px 12px 0;
      padding: 0.8em 1em;
      font-size: 0.8em;
    }

    .slide-table-wrap {
      overflow-x: auto;
      margin-top: 0.5em;
    }

    .reveal table.slide-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.72em;
    }

    .reveal table.slide-table th,
    .reveal table.slide-table td {
      border: 1px solid var(--border-color);
      padding: 0.42em 0.62em;
      text-align: left;
    }

    .reveal table.slide-table th {
      background: var(--bg-card);
      color: var(--accent);
    }

    .reveal pre {
      width: 100%;
      box-shadow: none;
      margin: 0.5em 0;
      font-size: 0.66em;
    }

    .reveal pre code {
      max-height: 390px;
      padding: 0.8em;
      border-radius: 10px;
      font-family: var(--font-mono);
    }

    .reveal .katex { font-size: 1.04em; }

    .reveal [data-widget],
    .reveal .slide-exercise-slot {
      pointer-events: auto;
      touch-action: manipulation;
    }

    .slide-nav-btn {
      position: fixed;
      top: 52%;
      transform: translateY(-50%);
      z-index: 95;
      width: 44px;
      height: 54px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.76);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 1.55rem;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    [data-theme="light"] .slide-nav-btn {
      background: rgba(255, 255, 255, 0.88);
    }

    .slide-nav-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .slide-nav-btn.prev { left: 10px; }
    .slide-nav-btn.next { right: 10px; }

    .reveal .controls,
    .reveal .progress {
      color: var(--accent);
    }

    .slides-hamburger {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 8px;
      width: 36px;
      height: 36px;
      font-size: 1.1rem;
      cursor: pointer;
      place-items: center;
      flex-shrink: 0;
    }

    .slides-drawer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
    }

    .slides-drawer.open { display: flex; justify-content: flex-end; }

    .slides-drawer-panel {
      width: min(320px, 88vw);
      height: 100%;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border-color);
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      overflow-y: auto;
    }

    .slides-drawer-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--border-color);
      font-weight: 700;
    }

    @media (max-width: 900px) {
      .slides-controls { display: none; }
      .slides-hamburger { display: grid; }
      .slides-topbar { padding: 0 0.75rem; }
      .reveal .slides section { padding: 0.9rem 1rem 2.2rem !important; }
      .reveal h2 { font-size: 1.25em; }
      .reveal h3 { font-size: 1.0em; }
      .reveal ul { font-size: 0.8em; }
      .slide-nav-btn { display: none; }
      .slide-lead { max-width: 100%; }
    }

    @media print {
      .slides-topbar,
      .slides-drawer,
      .slide-nav-btn,
      .reveal .controls,
      .reveal .progress {
        display: none !important;
      }
      html, body, .deck-stage, .reveal {
        height: auto !important;
        overflow: visible !important;
        background: #ffffff !important;
        color: #111827 !important;
      }
      .reveal .slides {
        position: static !important;
        width: 100% !important;
        height: auto !important;
        transform: none !important;
      }
      .reveal .slides section {
        display: block !important;
        position: static !important;
        opacity: 1 !important;
        visibility: visible !important;
        page-break-after: always;
        break-after: page;
        background: #ffffff !important;
        color: #111827 !important;
      }
    }
  </style>
</head>
<body>
  <div class="slides-topbar">
    <a class="brand-mini" href="index.html">
      <span class="icon">CV</span>
      <span id="slides-brand-text">Kompyuterli Ko'rish</span>
    </a>

    <div class="slides-controls">
      <select id="topic-selector" class="topic-select" aria-label="Select topic"></select>
      <a id="open-lecture-link" class="btn btn-secondary btn-sm" href="topic.html?id=1">📖 Ma'ruza</a>
      <button id="slide-frag-toggle" class="btn btn-secondary btn-sm" type="button">✨ Anim: ON</button>
      <button id="slide-print-btn" class="btn btn-secondary btn-sm" type="button">🖨️ PDF</button>
      <button id="slide-lang-btn" class="lang-btn" type="button">UZ / EN</button>
      <button id="slide-theme-btn" class="theme-btn" type="button" title="Tema">☀️ / 🌙</button>
      <button class="btn btn-primary btn-sm" id="btn-fullscreen" type="button">⛶</button>
    </div>

    <button id="slides-hamburger" class="slides-hamburger" type="button" aria-label="Menu">☰</button>
  </div>

  <div id="slides-drawer" class="slides-drawer">
    <div class="slides-drawer-panel">
      <div class="slides-drawer-head">
        <span>⚙️ Slayd boshqaruvi</span>
        <button id="slides-drawer-close" class="btn btn-secondary btn-sm" type="button">✕</button>
      </div>
      <label style="font-size:0.82rem;color:var(--text-muted);">Mavzu (M1–M23, B1)</label>
      <select id="topic-selector-mobile" class="topic-select" style="max-width:100%;width:100%;"></select>
      <a id="open-lecture-link-mobile" class="btn btn-primary" href="topic.html?id=1">📖 Ma'ruzani ochish</a>
      <button id="slide-frag-toggle-mobile" class="btn btn-secondary" type="button">✨ Animatsiya: ON</button>
      <button id="slide-print-btn-mobile" class="btn btn-secondary" type="button">🖨️ PDF / Chop etish</button>
      <button id="slide-lang-btn-mobile" class="btn btn-secondary" type="button">🌐 Til: O'zbekcha / English</button>
      <button id="slide-theme-btn-mobile" class="btn btn-secondary" type="button">🌓 Tema almashtirish</button>
      <a class="btn btn-secondary" href="labs.html">🧪 Amaliy Lablar (A1–A22)</a>
      <a class="btn btn-secondary" href="practice.html">🔬 Interaktiv CV Lab</a>
      <a class="btn btn-secondary" href="quiz.html">📝 203 Test Banki</a>
      <a class="btn btn-secondary" href="index.html">🏠 Bosh sahifa</a>
    </div>
  </div>

  <div class="deck-stage">
    <button type="button" class="slide-nav-btn prev" id="slide-prev-btn" aria-label="Previous slide">‹</button>
    <button type="button" class="slide-nav-btn next" id="slide-next-btn" aria-label="Next slide">›</button>
    <div class="reveal" id="reveal-root">
      <div class="slides" id="slides-container"></div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/data-topics-1.js"></script>
  <script src="js/data-topics-2.js"></script>
  <script src="js/data-topics-3.js"></script>
  <script src="js/data-topics-4.js"></script>
  <script src="js/data-topics-5.js"></script>
  <script src="js/data-labs.js"></script>
  <script src="js/slide-widgets.js"></script>
  <script src="js/quiz-engine.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <script>
    (function () {
      const { getLang, setLang, toggleTheme, getTheme } = window.CV_APP;
      const topics = window.CV_TOPICS || [];
      const labs = window.CV_LABS || [];
      let deck = null;

      function getTopicId() {
        const params = new URLSearchParams(window.location.search);
        const raw = Number(params.get('topic') || params.get('id'));
        if (raw && topics.some((tp) => tp.id === raw)) return raw;
        return topics[0] ? topics[0].id : 1;
      }

      let currentTopicId = getTopicId();
      let fragmentsEnabled = localStorage.getItem('cv_slides_fragments') !== '0';

      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function applyRevealThemeLink() {
        const link = document.getElementById('reveal-theme');
        if (!link) return;
        const t = getTheme();
        link.href = t === 'light'
          ? 'https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css'
          : 'https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.css';
      }

      function populateSelector() {
        const l = getLang();
        const optsHtml = topics.map((tp) => {
          const ttl = tp.title[l] || tp.title.uz;
          return `<option value="${tp.id}" ${tp.id === currentTopicId ? 'selected' : ''}>${tp.code}: ${escapeHtml(ttl)}</option>`;
        }).join('');

        ['topic-selector', 'topic-selector-mobile'].forEach((id) => {
          const sel = document.getElementById(id);
          if (sel) sel.innerHTML = optsHtml;
        });

        ['open-lecture-link', 'open-lecture-link-mobile'].forEach((id) => {
          const lecLink = document.getElementById(id);
          if (lecLink) {
            lecLink.href = `topic.html?id=${currentTopicId}`;
            lecLink.textContent = l === 'uz' ? "📖 Ma'ruza" : '📖 Lecture';
          }
        });

        const brand = document.getElementById('slides-brand-text');
        if (brand) brand.textContent = l === 'uz' ? "Kompyuterli Ko'rish" : 'Computer Vision';

        const langBtn = document.getElementById('slide-lang-btn');
        if (langBtn) langBtn.textContent = l === 'uz' ? "O'zbekcha" : 'English';

        const fragText = l === 'uz'
          ? (fragmentsEnabled ? '✨ Anim: ON' : '⚡ Anim: OFF')
          : (fragmentsEnabled ? '✨ Anim: ON' : '⚡ Anim: OFF');
        ['slide-frag-toggle', 'slide-frag-toggle-mobile'].forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.textContent = fragText;
        });
      }

      function buildSlidesHtml(topic) {
        const l = getLang();
        const title = topic.title[l] || topic.title.uz;
        const desc = topic.description[l] || topic.description.uz;
        const fragCls = fragmentsEnabled ? 'fragment' : '';
        const slides = [];
        const linkedLab = topic.labId ? labs.find((lb) => lb.id === topic.labId) : null;

        // 1. Cover Slide
        slides.push(`
          <section>
            <div class="slide-pill ${topic.isBonus ? 'bonus' : ''}">${topic.code} · KOK1506 · ${topic.hours} ${l === 'uz' ? 'soat' : 'hrs'}${linkedLab ? ` · ${linkedLab.code}` : ''}</div>
            <h1 style="font-size:1.8em;line-height:1.2;margin-bottom:0.35em;">${escapeHtml(title)}</h1>
            <p class="slide-lead">${escapeHtml(desc)}</p>
            ${(topic.keywords && topic.keywords.length) ? `
              <div style="display:flex;flex-wrap:wrap;gap:0.4em;margin-top:0.85em;">
                ${topic.keywords.slice(0, 6).map((kw) => `<span style="font-size:0.48em;padding:0.22em 0.65em;border-radius:999px;background:var(--bg-card);border:1px solid var(--border-color);">${escapeHtml(kw)}</span>`).join('')}
              </div>` : ''}
            <p style="font-size:0.5em;color:var(--text-muted);margin-top:1.1em;">
              ${l === 'uz' ? "Navigatsiya: ← / → yoki bo'shliq · Shift+← / → slaydga o'tish · F to'liq ekran" : 'Controls: ← / → or Space · Shift+← / → skip animations · F fullscreen'}
            </p>
          </section>
        `);

        // 2. Topic Slides
        (topic.slides || []).forEach((s) => {
          const sTitle = (s.title && (s.title[l] || s.title.uz)) || '';
          const sSub = s.subtitle ? (s.subtitle[l] || s.subtitle.uz || '') : '';
          let inner = `<h2>${escapeHtml(sTitle)}</h2>`;
          if (sSub) inner += `<h3>${escapeHtml(sSub)}</h3>`;

          if (s.latex) {
            inner += `<div class="slide-formula-card">$$${s.latex}$$</div>`;
          }

          if (s.points) {
            const pts = s.points[l] || s.points.uz || [];
            inner += `<ul>${pts.map((pt) => `<li class="${fragCls}">${escapeHtml(pt)}</li>`).join('')}</ul>`;
          }

          if (s.table) {
            const hdrs = s.table.headers[l] || s.table.headers.uz || [];
            const rows = s.table.rows[l] || s.table.rows.uz || [];
            inner += `
              <div class="slide-table-wrap">
                <table class="slide-table">
                  <thead><tr>${hdrs.map((h) => `<th>${escapeHtml(h)}</th>`).join('')}</tr></thead>
                  <tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody>
                </table>
              </div>`;
          }

          if (s.widget) {
            inner += `<div class="widget-wrap" data-widget="${escapeHtml(s.widget)}"></div>`;
          }

          if (s.discussion) {
            const q = s.discussion.q[l] || s.discussion.q.uz;
            const a = s.discussion.a[l] || s.discussion.a.uz;
            inner += `
              <div class="slide-discuss-card">
                <p style="margin:0 0 0.5em;"><strong>💬 ${escapeHtml(q)}</strong></p>
                <p class="${fragCls}" style="margin:0;color:var(--emerald);"><strong>→ ${l === 'uz' ? 'Javob' : 'Answer'}:</strong> ${escapeHtml(a)}</p>
              </div>`;
          }

          slides.push(`<section>${inner}</section>`);
        });

        // 3. Linked Practical Lab Code Slide (if present)
        if (linkedLab) {
          slides.push(`
            <section>
              <h2>${linkedLab.code}: ${escapeHtml(linkedLab.title[l] || linkedLab.title.uz)}</h2>
              <p style="font-size:0.74em;color:var(--text-secondary);">${escapeHtml(linkedLab.commonTask[l] || linkedLab.commonTask.uz)}</p>
              <pre><code class="language-python" data-trim data-noescape>${escapeHtml(linkedLab.pythonCode || linkedLab.code_py || '')}</code></pre>
              <p style="font-size:0.55em;margin-top:0.5em;"><a href="labs.html?id=${linkedLab.id}" style="color:var(--accent);">🧪 ${l === 'uz' ? '40 ta talaba varianti va .ipynb generatorni ochish →' : 'Open 40 student variants & .ipynb exporter →'}</a></p>
            </section>
          `);
        }

        // 4. Interactive Quiz Check Slide (1st MCQ from topic)
        if (topic.quiz && topic.quiz.length) {
          slides.push(`
            <section>
              <h2>⚡ ${l === 'uz' ? 'Tezkor Nazorat Savoli' : 'Quick Checkpoint Question'}</h2>
              <div class="slide-exercise-slot" data-topic-id="${topic.id}" data-q-idx="0"></div>
              <p style="font-size:0.52em;margin-top:0.65em;">
                <a href="quiz.html#topic-${topic.id}" style="color:var(--accent);">📝 ${l === 'uz' ? "Barcha savollar, moslashtirish va 203-test bankiga o'tish →" : 'Open all topic drills & 203-question test bank →'}</a>
              </p>
            </section>
          `);
        }

        return slides.join('\n');
      }

      async function renderDeck(preserveSlideIndex) {
        const container = document.getElementById('slides-container');
        const topic = topics.find((tp) => tp.id === currentTopicId) || topics[0];
        if (!topic || !container) return;

        let savedIndices = null;
        if (preserveSlideIndex && deck) {
          savedIndices = deck.getIndices();
        }
        if (deck) {
          try { deck.destroy(); } catch (_) {}
          deck = null;
        }

        applyRevealThemeLink();
        populateSelector();
        container.innerHTML = buildSlidesHtml(topic);

        if (window.CV_WIDGETS && typeof window.CV_WIDGETS.renderWidget === 'function') {
          container.querySelectorAll('[data-widget]').forEach((el) => {
            window.CV_WIDGETS.renderWidget(el, el.dataset.widget);
          });
        }

        if (window.CV_QUIZ && typeof window.CV_QUIZ.renderSlideExercise === 'function') {
          container.querySelectorAll('.slide-exercise-slot').forEach((slot) => {
            const qIdx = Number(slot.dataset.qIdx) || 0;
            window.CV_QUIZ.renderSlideExercise(slot, topic, qIdx);
          });
        }

        const isMobile = window.innerWidth <= 900;
        if (typeof Reveal !== 'undefined') {
          const plugins = [];
          if (typeof RevealHighlight !== 'undefined') plugins.push(RevealHighlight);
          if (typeof RevealNotes !== 'undefined') plugins.push(RevealNotes);
          deck = new Reveal(document.getElementById('reveal-root'), {
            embedded: true,
            hash: false,
            controls: true,
            progress: true,
            center: false,
            touch: true,
            fragments: fragmentsEnabled,
            transition: 'slide',
            width: isMobile ? 760 : 1140,
            height: isMobile ? 960 : 720,
            margin: isMobile ? 0.04 : 0.05,
            minScale: 0.25,
            maxScale: 1.5,
            plugins
          });

          await deck.initialize();

          if (savedIndices) {
            deck.slide(savedIndices.h, savedIndices.v, savedIndices.f);
          }
        }

        container.querySelectorAll('.slide-exercise-slot, [data-widget]').forEach((el) => {
          ['pointerdown', 'touchstart', 'touchend', 'click'].forEach((evt) => {
            el.addEventListener(evt, (e) => e.stopPropagation(), { passive: false });
          });
        });

        if (typeof window.renderMathInElement === 'function') {
          window.renderMathInElement(container, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false },
              { left: '\\(', right: '\\)', display: false },
              { left: '\\[', right: '\\]', display: true }
            ],
            throwOnError: false
          });
        }
      }

      document.getElementById('topic-selector').addEventListener('change', (e) => {
        currentTopicId = Number(e.target.value);
        const url = new URL(window.location.href);
        url.searchParams.set('topic', String(currentTopicId));
        window.history.replaceState({}, '', url);
        renderDeck(false);
      });

      document.getElementById('topic-selector-mobile').addEventListener('change', (e) => {
        currentTopicId = Number(e.target.value);
        const url = new URL(window.location.href);
        url.searchParams.set('topic', String(currentTopicId));
        window.history.replaceState({}, '', url);
        document.getElementById('slides-drawer').classList.remove('open');
        renderDeck(false);
      });

      function doToggleFragments() {
        fragmentsEnabled = !fragmentsEnabled;
        localStorage.setItem('cv_slides_fragments', fragmentsEnabled ? '1' : '0');
        renderDeck(true);
      }

      document.getElementById('slide-frag-toggle').addEventListener('click', doToggleFragments);
      document.getElementById('slide-frag-toggle-mobile').addEventListener('click', doToggleFragments);

      document.getElementById('slide-print-btn').addEventListener('click', () => window.print());
      document.getElementById('slide-print-btn-mobile').addEventListener('click', () => {
        document.getElementById('slides-drawer').classList.remove('open');
        setTimeout(() => window.print(), 150);
      });

      document.getElementById('slide-lang-btn').addEventListener('click', () => {
        setLang(getLang() === 'uz' ? 'en' : 'uz');
        renderDeck(true);
      });
      document.getElementById('slide-lang-btn-mobile').addEventListener('click', () => {
        setLang(getLang() === 'uz' ? 'en' : 'uz');
        renderDeck(true);
      });

      document.getElementById('slide-theme-btn').addEventListener('click', () => {
        toggleTheme();
        applyRevealThemeLink();
      });
      document.getElementById('slide-theme-btn-mobile').addEventListener('click', () => {
        toggleTheme();
        applyRevealThemeLink();
      });

      document.getElementById('btn-fullscreen').addEventListener('click', () => {
        const el = document.documentElement;
        if (!document.fullscreenElement) {
          el.requestFullscreen && el.requestFullscreen();
        } else {
          document.exitFullscreen && document.exitFullscreen();
        }
      });

      document.getElementById('slide-prev-btn').addEventListener('click', () => { if (deck) deck.left(); });
      document.getElementById('slide-next-btn').addEventListener('click', () => { if (deck) deck.right(); });

      window.addEventListener('keydown', (e) => {
        if (!deck || !e.shiftKey) return;
        if (e.key === 'ArrowRight') { e.preventDefault(); deck.right(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); deck.left(); }
      });

      const drawer = document.getElementById('slides-drawer');
      document.getElementById('slides-hamburger').addEventListener('click', () => drawer.classList.add('open'));
      document.getElementById('slides-drawer-close').addEventListener('click', () => drawer.classList.remove('open'));
      drawer.addEventListener('click', (e) => { if (e.target === drawer) drawer.classList.remove('open'); });

      window.addEventListener('resize', () => { if (deck) deck.layout(); });
      window.addEventListener('cv:langchange', () => renderDeck(true));

      window.addEventListener('load', () => renderDeck(false));
    })();
  </script>
</body>
</html>
